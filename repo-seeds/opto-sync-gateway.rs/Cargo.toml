[package]
name = "opto-sync-gateway"
version = "0.1.0"
edition = "2021"
description = "Authenticated realtime replication/session plane for Opto Sync"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
