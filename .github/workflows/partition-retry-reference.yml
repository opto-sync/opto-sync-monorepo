name: partition-retry-reference
on:
  pull_request:
    paths:
      - 'tests/partition_retry_reference.test.mjs'
      - '.github/workflows/partition-retry-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '22.16.0'
      - run: node --test tests/partition_retry_reference.test.mjs
